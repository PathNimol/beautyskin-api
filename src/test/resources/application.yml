spring:
  flyway:
    enabled: false

  datasource:
    url: jdbc:h2:mem:beautyskin;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret

server:
  port: 0

app:
  cors:
    allowed-origins: http://localhost:4028
  jwt:
    secret: test-jwt-secret-key-at-least-32-characters-long-for-tests
    access-expiration-ms: 3600000
    refresh-expiration-ms: 604800000
  otp:
    expiration-minutes: 5
    demo-code: "123456"
  oauth2:
    frontend-redirect-url: http://localhost:4028/oauth2/callback
