spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:beautyskin;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

app:
  jwt:
    secret: test-jwt-secret-key-at-least-32-characters-long
    access-expiration-ms: 3600000
    refresh-expiration-ms: 604800000
