spring:
  application:
    name: beautyskin-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:beautyskin-db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:151003}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    operations-sorter: method
    tags-sorter: alpha

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4028,http://127.0.0.1:4028}
  jwt:
    secret: ${JWT_SECRET:bs-online-shop-jwt-secret-key-change-in-production-min-256-bits-long!!}
    access-expiration-ms: ${JWT_ACCESS_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_MS:604800000}
  otp:
    expiration-minutes: 5
    demo-code: "123456"
  oauth2:
    frontend-redirect-url: ${FRONTEND_REDIRECT_URL:http://localhost:4028/oauth2/callback}

logging:
  level:
    root: INFO
    com.acleda.bsonlineshop: DEBUG
    org.springframework.security: INFO