services:
  postgres:
    image: postgres:16-alpine
    container_name: beautyskin-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-151003}
      POSTGRES_DB: ${DB_NAME:-beautyskin-db}
    volumes:
      - beautyskin_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-beautyskin-db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  beautyskin_postgres_data:
