services:
  postgres:
    image: postgres:16-alpine
    container_name: beautyskin-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beautyskin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beautyskin}
      POSTGRES_DB: ${POSTGRES_DB:-beautyskin}
    volumes:
      - beautyskin_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-beautyskin} -d ${POSTGRES_DB:-beautyskin}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  beautyskin_postgres_data:
